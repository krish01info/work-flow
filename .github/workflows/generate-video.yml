# .github/workflows/generate-video.yml
name: Generate & Publish Instagram Reel

on:
  schedule:
    # 2 uploads/day: 12:47 and 19:47 IST (cron is UTC). Six near-identical
    # reels a day read as spam and drag down the whole account's reach.
    # Off-the-hour minutes because GitHub delays jobs queued at :00.
    - cron: '17 7,14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Music selection mode"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - manual
      audio_id:
        description: "Instagram audio ID (manual mode only — leave empty for auto)"
        required: false
        type: string

concurrency:
  group: reel-pipeline
  cancel-in-progress: false

jobs:
  build-and-publish-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      - name: Confirm mood clips exist
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path("assets/clips/clips.json").read_text(encoding="utf-8"))
          missing = []
          for clip in manifest["clips"]:
              found = pathlib.Path(clip["file"]).is_file()
              print(f'{clip["mood"]:>6}  {clip["name"]:<8}  {clip["file"]}  {"ok" if found else "MISSING"}')
              if not found:
                  missing.append(clip["file"])
          print(f'moods without a clip use: {manifest.get("fallback", "sad")}')
          if missing:
              print("::error::Clip files missing from the repo: " + ", ".join(missing))
              sys.exit(1)
          EOF

      - name: Validate inputs
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          AID="${{ github.event.inputs.audio_id || '' }}"
          echo "Selection mode : $MODE"
          echo "Audio ID given : $([ -n "$AID" ] && echo 'yes' || echo 'no')"
          if [[ "$MODE" == "manual" && -z "$AID" ]]; then
            echo "::error::Manual mode requires an audio_id. Re-run the workflow and enter an Instagram audio ID."
            exit 1
          fi

      - name: Run Reel Builder
        env:
          # Instagram / Meta
          INSTAGRAM_USER_ID:      ${{ secrets.INSTAGRAM_USER_ID }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}

          # Google Drive (for video hosting)
          GOOGLE_CLIENT_ID:       ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:   ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN:    ${{ secrets.DRIVE_REFRESH_TOKEN }}

          # Reel config (override defaults via secrets if needed).
          # Each clip's timings, framing and cover frame live in
          # assets/clips/clips.json; the song's mood picks the clip.
          OUTPUT_VIDEO:           final_reel.mp4
          REEL_MAX_DURATION:      "15"
          PUBLISH_REEL:           "true"
          INSTAGRAM_CAPTION:      ${{ secrets.INSTAGRAM_CAPTION }}
          SHARE_TO_FEED:          "true"

          # Video dimensions — Instagram Reels must be 9:16 portrait
          VIDEO_WIDTH:            "1080"
          VIDEO_HEIGHT:           "1920"
          VIDEO_FPS:              "30"

          # Audio — boost for the dad's line (1.0 = original, 1.8 = 80% louder).
          # Clips with their own "audio_boost" in clips.json use that instead.
          ASSET_AUDIO_BOOST:      "1.8"
          # Last.fm API key for external music metadata (optional)
          LASTFM_API_KEY:         ${{ secrets.LASTFM_API_KEY }}
          # Selection mode: auto (default) or manual
          SELECTION_MODE:         ${{ github.event.inputs.mode || 'auto' }}
          MANUAL_AUDIO_ID:        ${{ github.event.inputs.audio_id || '' }}
        run: |
          set -euo pipefail
          echo "Running commit: $(git rev-parse HEAD)"
          python -m py_compile reelbuilder.py
          python -u reelbuilder.py

      - name: Upload final reel as artifact (backup / debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-reel-${{ github.run_id }}
          path: final_reel.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit music history back to repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/music_history.json
          git diff --cached --quiet || \
            git commit -m "chore: update music history [skip ci]"
          # main may have moved during the run (e.g. a code push) — rebase first
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push