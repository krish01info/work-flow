# .github/workflows/generate-video.yml
name: Generate & Publish Instagram Reel

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours (6 uploads/day)
  workflow_dispatch: {}     # manual trigger from Actions tab

concurrency:
  group: reel-pipeline
  cancel-in-progress: false

jobs:
  build-and-publish-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      - name: Confirm asset video exists
        run: |
          if [ ! -f "assets/the_transition_i_n_between_is.mp4" ]; then
            echo "::error::Asset video not found — commit assets/the_transition_i_n_between_is.mp4 to the repo"
            exit 1
          fi
          echo "Asset video found: $(du -sh assets/the_transition_i_n_between_is.mp4)"

      - name: Run Reel Builder
        env:
          # Instagram / Meta
          INSTAGRAM_USER_ID:      ${{ secrets.INSTAGRAM_USER_ID }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}

          # Google Drive (for video hosting)
          GOOGLE_CLIENT_ID:       ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:   ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN:    ${{ secrets.DRIVE_REFRESH_TOKEN }}

          # Reel config (override defaults via secrets if needed)
          ASSET_VIDEO:            assets/the_transition_i_n_between_is.mp4
          OUTPUT_VIDEO:           final_reel.mp4
          MUSIC_START_SECONDS:    "5.0"
          LOOP_START_SECONDS:     "9.5"
          REEL_MAX_DURATION:      "90"
          PUBLISH_REEL:           "true"
          INSTAGRAM_CAPTION:      ${{ secrets.INSTAGRAM_CAPTION }}
          SHARE_TO_FEED:          "true"

          # Video dimensions — Instagram Reels must be 9:16 portrait
          VIDEO_WIDTH:            "1080"
          VIDEO_HEIGHT:           "1920"
          VIDEO_FPS:              "30"

          # Audio — boost asset clip volume in first 5s (1.0 = original, 1.8 = 80% louder)
          ASSET_AUDIO_BOOST:      "1.8"
        run: |
          set -euo pipefail
          echo "Running commit: $(git rev-parse HEAD)"
          python -m py_compile reelbuilder.py
          python -u reelbuilder.py

      - name: Upload final reel as artifact (backup / debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-reel-${{ github.run_id }}
          path: final_reel.mp4
          retention-days: 7
          if-no-files-found: ignore